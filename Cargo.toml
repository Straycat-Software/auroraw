[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/patrickfournier/auroraw"
publish = false

[workspace.dependencies]
proptest = "1"
tempfile = "3"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# Unicode normalisation, to fold the place names of the filter for case and diacritics (design note 008 §5). Already
# in the tree through `idna`; only its data and its entry point are used here.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
getrandom = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
blake3 = "1"
quick-xml = "0.42"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
notify = "8"
# Golden renders of the image engine are small PNG files (testing strategy §5); already in the tree through `image`.
png = "0.18"
# The image engine (design note 005): only the back ends the product targets (architecture §6.6:
# no OpenGL), no web target, no window-system integration.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
# Blocks on wgpu's futures on the GPU thread: no async runtime (architecture §3.2, rule 7).
pollster = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The dev profile is the one the tests run in, and a few of them decode RAW files (the `rawler` decoder native in
# `imaging`, and compiled to WebAssembly under `wasmtime` in `plugin-host`): at `opt-level = 0` the two decode tests were
# a third of the tests' CPU time (issue #77, lever 2), and compiling the plugin (4.8 MB of WebAssembly) alone cost two
# CPU-minutes for every test process that did it. So the dependencies are optimised, as are the two small crates of ours
# that move the decoded bytes (`plugin-api`, `plugin-host`). The dependencies are cached with the rest (`rust-cache`);
# workspace crates are not, so a big crate of ours is NOT listed: `auroraw-imaging` at 2 costs about ten times the compile
# time (65 s against 675 s of CPU for the crate and its test binaries, Charlie's measure on #77) in every job, for a test
# that the optimised dependencies already bring from 79 to 24 s. The price of the dependencies is a longer cold build, and
# stepping through them in a debugger shows optimised code (set the package back to 0 for that, locally).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.auroraw-plugin-api]
opt-level = 2

[profile.dev.package.auroraw-plugin-host]
opt-level = 2
