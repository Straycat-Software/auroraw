name: Nightly

# Long runs that do not belong in the per-change workflow (docs/continuous-integration.md §3.2):
# the property tests with many cases, fuzzing, and the large-workspace and large-catalogue
# measurements on each platform. Runs every night, on demand (from any branch, to try a change of this file), and on a
# push to `dev` that changes this file or a measurement. Not on every branch: the `paths` filter alone did not keep it
# from starting on the first push of a branch, so a pull request's branch and each merge-queue entry started a full run.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/nightly.yml
      - crates/workspace/tests/large.rs
      - crates/workspace/tests/write_costs.rs
      - crates/catalogue/tests/large.rs
      - fuzz/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  properties:
    name: property tests, many cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install Qt (the Qt Quick interface crate, D-094)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.8.3
          cache: true
      # The Qt libraries need the platform's display, font and GL libraries (as in ci.yml).
      - name: Install the system libraries Qt Quick needs on Linux (display, fonts, GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev \
            libxi-dev libxcursor-dev libfontconfig1-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo test --workspace --release --locked
        env:
          PROPTEST_CASES: "5000"

  fuzz:
    name: fuzzing the readers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-fuzz
      - name: Each target for two minutes
        run: |
          failed=0
          for target in xmp_reader sidecars state_files raw_block; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=120 || failed=1
          done
          exit $failed
      - name: Keep the inputs that crashed a reader
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts

  large-workspace:
    name: large workspace (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Write, walk and read 100,000 photos and their versions
        run: cargo test -p auroraw-workspace --release --locked --test large -- --ignored --nocapture
        env:
          AUR_LARGE: "100000"
      - name: What each step of an atomic write costs
        run: cargo test -p auroraw-workspace --release --locked --test write_costs -- --ignored --nocapture

  large-catalogue:
    name: large catalogue (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Rebuild and query a catalogue of 100,000 photos
        run: cargo test -p auroraw-catalogue --release --locked --test large -- --ignored --nocapture
        env:
          AUR_LARGE: "100000"
