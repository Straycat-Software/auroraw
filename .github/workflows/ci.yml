name: CI

# The per-change workflow (docs/continuous-integration.md §3.1). Third-party actions are pinned
# to a full commit hash, with the version in a comment (§5).

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            plugins
      - name: Install Qt (the Qt Quick interface crate, D-094)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.8.3
          cache: true
      - name: Install the system libraries Qt Quick needs on Linux (display, fonts, GL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev \
            libxi-dev libxcursor-dev libfontconfig1-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Format and lint the WebAssembly plugins (a separate workspace, WP6)
        run: |
          cargo fmt --manifest-path plugins/Cargo.toml --all --check
          cargo clippy --manifest-path plugins/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Licence headers and dependency rules between crates
        run: cargo xtask check

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2025, arch: win64_msvc2022_64 }
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            plugins
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: nextest
      - name: Install ExifTool (interoperability tests)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl ;;
            macOS) brew install exiftool ;;
            Windows) choco install exiftool -y --no-progress ;;
          esac
      - name: Install Qt (the Qt Quick interface crate, D-094)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.8.3
          arch: ${{ matrix.arch }}
          cache: true
      - name: Install the system libraries Qt Quick needs on Linux (display, fonts, GL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev \
            libxi-dev libxcursor-dev libfontconfig1-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Cache RAW samples (testing strategy §5)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/samples
          key: raw-samples-${{ hashFiles('tools/fetch-samples.sh') }}
      - name: Fetch RAW samples
        shell: bash
        run: tools/fetch-samples.sh
      - name: Build the WebAssembly plugins (WP6)
        shell: bash
        run: tools/build-plugins.sh
      - run: cargo build --workspace --locked
      - run: cargo nextest run --workspace --locked --no-fail-fast --success-output final
        env:
          AUR_REQUIRE_EXIFTOOL: "1"
          AUR_REQUIRE_SAMPLES: "1"
          AUR_REQUIRE_PLUGINS: "1"
          # The interface tests draw every view to a PNG here (kept below).
          AUR_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
      - name: Keep the pictures of the views
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: views-${{ matrix.name }}
          path: snapshots
          if-no-files-found: ignore
          retention-days: 14
      - run: cargo test --workspace --doc --locked
      - name: Launch test
        run: cargo run --locked --package auroraw-app -- --self-test

  dependencies:
    name: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
